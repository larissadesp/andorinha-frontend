<div class="container-fluid">
    <div class="page-header">
        <div class="row">
            <div class="col-lg-6">
                <h3>Comentar</h3>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid">
    <div class="card">
        <div class="row">
            <div class="col-sm-12">
                <div class="card-body bg-novo-comentario">
                    <form #form="ngForm" (ngSubmit)="comentar(form)">
                        <textarea type="text" class="form-control" required name="textoNovoComentario"
                            [(ngModel)]="comentario.conteudo" placeholder="Digite seu comentário" rows="3">
                        </textarea>

                        <button type="submit" class="btn btn-primary">
                            Enviar
                        </button>

                        <div class="mt-3 mb-3 float-right"></div>
                    </form>
                </div>
            </div>
        </div> 
    </div>
</div>

<div class="container-fluid">
    <div class="page-header">
        <div class="row">
            <div class="col-lg-6">
                <h3>Comentários</h3>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12 col-sm-12" *ngFor="let comentario of comentarios">
            <div class="card comentario-card">
                <div class="card-header comentario-header">
                    <div>
                        <span class="comentario-name">{{comentario.usuario.nome}}</span>
                        <span class="message-data-time pull-right f-14">{{comentario.data | date: 'dd/MM/yyyy HH:mm'
                            }}</span>
                    </div>
                </div>
                <div class="card-body  p-l-0">
                    <p class="mb-0"> {{comentario.conteudo}} </p>
                </div>
            </div>
        </div>
    </div>
</div>
