<!-- Container-fluid starts -->
<div class="container-fluid">
  <div class="page-header">
    <div class="row">
      <div class="col-lg-6">
        <h3>Listagem de Usuários</h3>
      </div>
      <div class="col-lg-6">
        <ol class="breadcrumb pull-right">
          <li class="breadcrumb-item"><a [routerLink]="'/home'"><i class="fa fa-home"></i></a>
          </li>
          <li class="breadcrumb-item active">Usuários</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<!-- Container-fluid Ends -->
<div class="container-fluid">
  <div class="row">
    <div class="col-sm-12 ml-2 mb-3">
      <div class="card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-sm">
              <thead>
                <tr class="tituloColuna">
                  <th scope="col">#</th>
                  <th scope="col">Nome</th>
                  <th scope="col">Nome de usuário</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let usuario of usuarios; let i = index">
                  <th scope="row">{{i+1}}</th>
                  <td>{{usuario.nome}}</td>
                  <td>{{usuario.login}}</td>
                </tr>
              </tbody>
            </table>
            <hr>
          </div>
          <div class="row">
            <div class="col-sm-6">
              <div class="count-registros">{{totalUsuarios}} registros encontrados</div>
            </div>
            <div class="col-sm-6">
              <ngb-pagination class="float-right" [(page)]="seletor.pagina" [pageSize]="seletor.limite"
                [collectionSize]="totalUsuarios" (pageChange)="pesquisar()"></ngb-pagination>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
